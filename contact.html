<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yasmin Sherefa | Contact</title>

  <link rel="stylesheet" href="output.css">

  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>

</head>

<body class="bg-sky-50 text-gray-800 dark:bg-gray-900 dark:text-white transition-colors duration-300">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 shadow-md">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center px-8 py-6">

      <h1 class="font-bold text-[clamp(2rem,5vw,4rem)] text-gray-900 dark:text-white">
        Yasmin Sherefa
      </h1>

      <nav class="flex gap-8 mt-5 md:mt-0">

        <a href="index.html"
          class="font-semibold text-red-600 hover:text-red-700 hover:underline transition">
          Home
        </a>

        <a href="projects.html"
          class="font-semibold text-red-600 hover:text-red-700 hover:underline transition">
          Projects
        </a>

        <a href="contact.html"
          class="font-semibold text-red-700 underline">
          Contact
        </a>

      </nav>

      <button id="theme-toggle"
        class="mt-5 md:mt-0 bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
        🌙 Dark Mode
      </button>

    </div>

  </header>

  <!-- Main -->
  <main class="max-w-4xl mx-auto px-6 py-10">

    <section
      class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 hover:shadow-2xl transition duration-300">

      <h2 class="text-4xl font-bold text-center mb-4 dark:text-white">
        Contact Me
      </h2>

      <p class="text-center text-gray-600 dark:text-gray-300 max-w-2xl mx-auto mb-8">
        Thank you for visiting my portfolio. If you'd like to collaborate,
        ask a question, or simply say hello, feel free to send me a message.
        I'd be happy to hear from you!
      </p>

      <form class="space-y-6">

        <div>

          <label for="name" class="block font-semibold mb-2 dark:text-white">
            Full Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white p-3 focus:outline-none focus:ring-2 focus:ring-red-500 transition">

        </div>

        <div>

          <label for="email" class="block font-semibold mb-2 dark:text-white">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white p-3 focus:outline-none focus:ring-2 focus:ring-red-500 transition">

        </div>

        <div>

          <label for="message" class="block font-semibold mb-2 dark:text-white">
            Message
          </label>

          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Write your message here..."
            required
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white p-3 focus:outline-none focus:ring-2 focus:ring-red-500 transition"></textarea>

        </div>

        <div class="text-center">

          <button
            type="submit"
            class="bg-red-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-red-700 hover:scale-105 transition duration-300 shadow-md">

            Send Message

          </button>

        </div>

      </form>

    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-10">

    <div class="max-w-6xl mx-auto py-6 text-center text-gray-500 dark:text-gray-300">

      <p>&copy; 2026 Yasmin Sherefa. All Rights Reserved.</p>

    </div>

  </footer>

  <script>
    const button = document.getElementById("theme-toggle");

    if (document.documentElement.classList.contains("dark")) {
      button.textContent = "☀️ Light Mode";
    }

    button.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");

      if (document.documentElement.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
        button.textContent = "☀️ Light Mode";
      } else {
        localStorage.setItem("theme", "light");
        button.textContent = "🌙 Dark Mode";
      }
    });
  </script>

</body>

</html>
